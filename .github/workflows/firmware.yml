name: Build firmware

# Compiles the ESP32 sketch for the Waveshare ESP32-S3 board on every change,
# so a broken build is caught before anyone tries to flash the sign.
#
# On main, the build is also published as a GitHub release (fw-<number>). The
# sign checks the latest release every 10 minutes and updates itself over the
# air -- that's how firmware changes reach it without a USB cable.
on:
  push:
    paths: ["firmware/**", "tools/sim/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "tools/sim/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: write   # publish firmware releases

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "ArduinoJson" "Adafruit GFX Library" "ESP32 HUB75 LED MATRIX PANEL DMA Display"

      - name: Use placeholder Wi-Fi secrets
        run: cp firmware/mta_sign/secrets.example.h firmware/mta_sign/secrets.h

      - name: Compile (firmware version = build number ${{ github.run_number }})
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --warnings default \
            --build-property "compiler.cpp.extra_flags=-DFW_VERSION=${{ github.run_number }}" \
            --output-dir build firmware/mta_sign

      - uses: actions/upload-artifact@v4
        with:
          name: mta_sign-firmware
          path: build/*.bin

      - name: Publish release for over-the-air update (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ github.run_number }}
        run: |
          cp build/mta_sign.ino.bin build/mta_sign.bin
          echo "$V" > build/version.txt
          gh release create "fw-$V" build/mta_sign.bin build/version.txt \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Firmware $V" \
            --notes "Built from ${{ github.sha }}. The sign installs this automatically within ~10 minutes."

  preview:
    # Renders GIF previews of every screen and animation using the real drawing code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: tools/sim/build_previews.sh previews
      - uses: actions/upload-artifact@v4
        with:
          name: screen-previews
          path: previews/
