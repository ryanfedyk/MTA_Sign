name: Check sign health

# Checks the live system. Run it from the Actions tab whenever the
# sign or the control panel seems off. It changes nothing unless you tick
# "send a test cat".
on:
  workflow_dispatch:
    inputs:
      play_cat:
        description: "Also send a test 'peek' cat to the sign"
        type: boolean
        default: false
      bus_debug:
        description: "Also dump what both MTA bus feeds report for the B48 stop"
        type: boolean
        default: false
      test_gemini:
        description: "Also ask Gemini for a test animation (saved, then deleted)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check endpoints
        env:
          SIGN_APP_PIN: ${{ secrets.SIGN_APP_PIN }}
        run: |
          BASE=https://us-central1-mta-transit-matrix.cloudfunctions.net
          echo "== /transit (arrivals the sign shows)"
          curl -sS -w "\n   HTTP %{http_code}\n" "$BASE/transit"
          echo
          echo "== Service alerts the cloud sees right now (MTA feed)"
          curl -sS "$BASE/transit?debug=1" | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).debug || {};
            const a = d.alerts || {};
            console.log("   feed reachable:", a.ok);
            for (const r of ["L", "B48"]) console.log(`   ${r}:`, a[r] ? `${a[r].label || "good service"} ${a[r].headline ? "— " + a[r].headline : ""}` : "?");
            if (a.stats) console.log(`   parsed ${a.stats.subwayAlerts} subway alerts, ${a.stats.activeNow} active now, on routes: ${a.stats.routesWithAlerts.join(" ")}`);'
          echo
          echo "== Raw MTA alert feed reachability (from GitHub)"
          curl -sS -o /dev/null -w "   subway-alerts.json HTTP %{http_code}, %{size_download} bytes\n" "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/camsys%2Fsubway-alerts.json"
          echo
          echo "== /sign (settings + commands the sign polls every 5 s)"
          curl -sS -w "\n   HTTP %{http_code}\n" "$BASE/sign"
          echo
          echo "== /app/api/settings (control panel, using SIGN_APP_PIN)"
          if [ -z "$SIGN_APP_PIN" ]; then echo "   SIGN_APP_PIN secret is not set"; exit 0; fi
          curl -sS -w "\n   HTTP %{http_code}\n" -H "x-sign-pin: $SIGN_APP_PIN" "$BASE/app/api/settings"
          echo
          if [ "${{ inputs.play_cat }}" = "true" ]; then
            echo "== Sending a test cat (peek) through the control panel API"
            curl -sS -w "\n   HTTP %{http_code}\n" -X POST -H "content-type: application/json" \
              -H "x-sign-pin: $SIGN_APP_PIN" -d '{"name":"peek"}' "$BASE/app/api/play"
            echo "== /sign right after (should now include \"a\")"
            curl -sS -w "\n   HTTP %{http_code}\n" "$BASE/sign"
            echo
          fi
          if [ "${{ inputs.test_gemini }}" = "true" ]; then
            echo "== Asking Gemini for a test animation (can take a couple of minutes)"
            out=$(curl -sS -m 320 -w "\n%{http_code}" -X POST -H "content-type: application/json" \
              -H "x-sign-pin: $SIGN_APP_PIN" -d '{"prompt":"a small cat walks across the bottom of the sign"}' \
              "$BASE/app/api/animations/generate")
            code=$(echo "$out" | tail -n1); body=$(echo "$out" | sed '$d')
            echo "   HTTP $code"
            echo "$body" | node -e '
              const b = JSON.parse(require("fs").readFileSync(0, "utf8"));
              if (!b.animation) { console.log("   error:", b.error); process.exit(0); }
              const s = b.animation.spec;
              console.log("   name:", s.name, "| duration:", s.duration_ms, "ms | background:", s.background);
              console.log("   colors:", Object.keys(s.palette).length, "| sprites:", s.sprites.map(x => x.frames[0][0].length + "x" + x.frames[0].length + "x" + x.frames.length + "f").join(", "), "| actors:", s.actors.length);
              console.log(s.sprites[0].frames[0].map(r => "   " + r).join("\n"));
              require("fs").writeFileSync("/tmp/anim_id", b.animation.id);'
            if [ -s /tmp/anim_id ]; then
              curl -sS -o /dev/null -X POST -H "content-type: application/json" -H "x-sign-pin: $SIGN_APP_PIN" \
                -d "{\"id\":\"$(cat /tmp/anim_id)\"}" "$BASE/app/api/animations/delete" && echo "   (test animation deleted)"
            fi
            echo
          fi
          if [ "${{ inputs.bus_debug }}" = "true" ]; then
            for DIR in SB NB; do
              echo "== B48 $DIR: raw feeds (minutes from now)"
              curl -sS "$BASE/transit?debug=raw&dir=$DIR" | node -e '
                const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
                console.log("   sign shows:", JSON.stringify(d.b));
                console.log("   merged:", JSON.stringify(d.debug.allMergedArrivals));
                console.log("   OneBusAway:"); for (const x of d.debug.raw.oba) console.log("     ", JSON.stringify(x));
                console.log("   SIRI:"); for (const x of d.debug.raw.siri) console.log("     ", JSON.stringify(x));'
              echo
            done
          fi
          echo "How to read this:"
          echo " - /app HTTP 503 mentioning the database -> Firestore isn't set up (see README)."
          echo " - /app HTTP 401 -> the passphrase secret doesn't match what was deployed; re-run the deploy."
          echo " - lastSeenSecondsAgo null or large -> the sign isn't reaching /sign."
