name: Test & deploy cloud function

# - Every pull request: run the offline tests.
# - Every push to main that touches the cloud function: test, then deploy to Firebase.
# - "Run workflow" button on the Actions tab: test, then deploy on demand.
on:
  pull_request:
    paths: ["functions/**", "firebase.json", ".firebaserc", ".github/workflows/deploy-functions.yml", ".github/scripts/**"]
  push:
    branches: [main]
    paths: ["functions/**", "firebase.json", ".firebaserc", ".github/workflows/deploy-functions.yml", ".github/scripts/**"]
  workflow_dispatch:

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Check required secrets are set
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          MTA_BUS_KEY: ${{ secrets.MTA_BUS_KEY }}
          SIGN_APP_PIN: ${{ secrets.SIGN_APP_PIN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          [ -n "$GCP_SA_KEY" ]  || { echo "::error::Repository secret GCP_SA_KEY is not set (see README → One-time setup)"; missing=1; }
          [ -n "$MTA_BUS_KEY" ] || { echo "::error::Repository secret MTA_BUS_KEY is not set (see README → One-time setup)"; missing=1; }
          [ -n "$SIGN_APP_PIN" ] || echo "::warning::Repository secret SIGN_APP_PIN is not set, so the control panel stays locked (see README → One-time setup)"
          [ -n "$GEMINI_API_KEY" ] || echo "::warning::Repository secret GEMINI_API_KEY is not set, so 'Create with Gemini' is disabled (see README)"
          exit $missing

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Write runtime config (functions/.env)
        env:
          MTA_BUS_KEY: ${{ secrets.MTA_BUS_KEY }}
          SIGN_APP_PIN: ${{ secrets.SIGN_APP_PIN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MTA_API_KEY: ${{ secrets.MTA_API_KEY }}
        # Values are written double-quoted and escaped so passphrases with spaces or symbols survive.
        run: |
          node -e '
            const q = (v) => JSON.stringify(String(v || "").trim());
            const lines = [`MTA_BUS_KEY=${q(process.env.MTA_BUS_KEY)}`];
            for (const k of ["SIGN_APP_PIN", "GEMINI_API_KEY", "GEMINI_MODEL", "MTA_API_KEY"])
              if (process.env[k]) lines.push(`${k}=${q(process.env[k])}`);
            require("fs").writeFileSync("functions/.env", lines.join("\n") + "\n");
          ' 

      - name: Authenticate to Google Cloud
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          node .github/scripts/write-gcp-key.js "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase
        run: npx --yes firebase-tools@15 deploy --only functions --project mta-transit-matrix --non-interactive --force

      - name: Smoke-test the live endpoints
        run: |
          sleep 10
          BASE=https://us-central1-mta-transit-matrix.cloudfunctions.net
          body=$(curl -fsS --retry 3 --retry-delay 5 "$BASE/transit")
          echo "transit: $body"
          echo "$body" | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!b.l||!b.b) process.exit(1)'
          body=$(curl -fsS --retry 3 --retry-delay 5 "$BASE/sign")
          echo "sign:    $body"
          echo "$body" | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!b.bd) process.exit(1)'
          body=$(curl -fsS --retry 3 --retry-delay 5 "$BASE/anims")
          echo "anims:   $(echo "$body" | head -c 200)"
          curl -fsS --retry 3 --retry-delay 5 "$BASE/app" | grep -q "Headway"
          echo "app:     OK  ->  $BASE/app"

      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"
